<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Film Catalog</title>
    <style>
        body        { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
        .film-card  { border: 1px solid #ddd; padding: 12px; margin: 8px 0; border-radius: 4px; }
        .rating     { display: inline-block; background: #333; color: white;
                      padding: 2px 6px; border-radius: 3px; font-size: 0.85em; }
        .price      { color: #27ae60; font-weight: bold; }
        .error      { color: red; padding: 10px; background: #fee; border-radius: 4px; }
        button      { padding: 8px 16px; margin: 4px; cursor: pointer; }
        input       { padding: 8px; margin: 4px; border: 1px solid #ccc; border-radius: 4px; }</style>
</head>
<body>
    <h1>Film Catalog</h1>

    <div>
        <button id="btn-load">Load Films</button>
        <input id="input-search" type="text" placeholder="Search title...">
        <button id="btn-search">Search</button>
    </div>

    <div id="status"></div>
    <div id="film-list"></div>

    <script type="module" src="dist/app.js"></script>
</body>
</html>
